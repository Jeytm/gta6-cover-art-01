<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Palms — Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">NEON <span>PALMS</span></div>
  <p class="tagline">Cover Studio — turn any photo into GTA-style poster art, offline.</p>
</header>
<main class="app">
  <section class="stage">
    <canvas id="preview" width="1080" height="1080" aria-label="Cover preview"></canvas>
    <p class="hint">Click a panel to select it · drag to move its photo · scroll to zoom</p>
  </section>
  <aside class="controls">
    <section class="group">
      <h2>1 · Photos</h2>
      <div id="photos" class="slots"></div>
      <p class="note">Photos stay on your machine — nothing is uploaded.</p>
    </section>
    <section class="group">
      <h2>2 · Layout</h2>
      <div id="layouts" class="picks"></div>
    </section>
    <section class="group">
      <h2>3 · Colour grade</h2>
      <div id="grades" class="picks"></div>
    </section>
    <section class="group">
      <h2>4 · Words</h2>
      <label>Title <input id="title" type="text" maxlength="28" value="NEON SHORE"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="A VICE CITY STORY"></label>
    </section>
    <section class="group">
      <h2>5 · Selected panel</h2>
      <p id="panelTitle" class="panel-title">Panel 1</p>
      <div id="photoChoices" class="picks"></div>
      <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.05" value="1"> <span id="zoomVal">1.00x</span></label>
      <label>Move X <input id="panX" type="range" min="-1" max="1" step="0.05" value="0"></label>
      <label>Move Y <input id="panY" type="range" min="-1" max="1" step="0.05" value="0"></label>
      <div class="row">
        <button id="flip" type="button">Flip</button>
        <button id="fillAll" type="button">Use in all panels</button>
      </div>
    </section>
    <section class="group">
      <h2>6 · Finish</h2>
      <div id="sizes" class="picks"></div>
      <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="vignette" type="checkbox" checked> Vignette</label>
      <label class="check"><input id="badge" type="checkbox" checked> Star badge</label>
      <label>Stars <input id="stars" type="range" min="0" max="5" step="1" value="5"> <span id="starsVal">5 / 5</span></label>
      <div class="row">
        <button id="undo" type="button">Undo</button>
        <button id="redo" type="button">Redo</button>
      </div>
      <button id="exportOne" type="button" class="primary">Export this size as PNG</button>
      <button id="exportAll" type="button" class="primary">Export all 3 sizes</button>
      <p id="status" role="status"></p>
    </section>
  </aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
